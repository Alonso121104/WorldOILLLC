<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<title>World Oil Technician Dashboard</title>

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#0b0b0b">

<style>

* {
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #f4f4f4;
    color: #111;
    margin: 0;
    padding: 20px;
}

h1 {
    text-align: center;
    margin-bottom: 25px;
}

h2 {
    margin-top: 0;
}

.card,
.ticket {
    background: white;
    max-width: 650px;
    margin: 15px auto;
    padding: 20px;
    border-radius: 12px;
    box-shadow: 0 5px 15px rgba(0,0,0,0.15);
}

label {
    display: block;
    font-weight: bold;
    margin-bottom: 6px;
}

input {
    width: 100%;
    padding: 12px;
    margin-bottom: 10px;
    font-size: 16px;
    border: 2px solid #777;
    border-radius: 6px;
}

input:focus,
button:focus {
    outline: 3px solid #005fcc;
    outline-offset: 2px;
}

button {
    padding: 11px 15px;
    margin: 5px;
    border: none;
    border-radius: 6px;
    color: white;
    cursor: pointer;
    font-size: 15px;
    font-weight: bold;
}

.login {
    background: #111;
    width: 100%;
    margin: 0;
}

.logout,
.cancel {
    background: #b00020;
}

.refresh {
    background: #005fcc;
}

.accept {
    background: #187a35;
}

.complete {
    background: #111;
}

button:hover {
    filter: brightness(0.9);
}

.status {
    font-weight: bold;
    text-transform: uppercase;
}

.top-bar {
    max-width: 650px;
    margin: 0 auto 20px;
    text-align: center;
}

.button-row {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 5px;
}

.error {
    color: #8b0000;
    background: #ffe5e5;
    border: 2px solid #b00020;
    padding: 10px;
    border-radius: 6px;
    font-weight: bold;
}

.success {
    color: #145c2a;
    background: #e5f7e9;
    border: 2px solid #217a3c;
    padding: 10px;
    border-radius: 6px;
    font-weight: bold;
}

.empty {
    text-align: center;
    font-weight: bold;
}

.ticket-actions {
    margin-top: 15px;
    border-top: 1px solid #ddd;
    padding-top: 10px;
}

.subscription-required {
    text-align: center;
    max-width: 650px;
    margin: 30px auto;
}

@media (max-width: 600px) {

    body {
        padding: 10px;
    }

    .card,
    .ticket {
        padding: 15px;
    }

    .button-row {
        flex-direction: column;
    }

    button {
        width: 100%;
        margin: 4px 0;
    }
}

@media (prefers-reduced-motion: reduce) {

    * {
        animation: none !important;
        transition: none !important;
    }

}

</style>
</head>

<body>

<h1>World Oil Technician Dashboard</h1>


<!-- LOGIN -->

<div id="loginBox" class="card">

    <h2>Technician Login</h2>

    <p>
        Sign in with your technician account to access customer appointments.
    </p>

    <form id="loginForm">

        <label for="email">
            Technician Email
        </label>

        <input
            type="email"
            id="email"
            autocomplete="email"
            required
        >

        <label for="password">
            Technician Password
        </label>

        <input
            type="password"
            id="password"
            autocomplete="current-password"
            required
        >

        <button
            type="submit"
            class="login"
        >
            Login
        </button>

        <div
            id="loginMessage"
            role="alert"
            aria-live="assertive"
        ></div>

    </form>

</div>


<!-- DASHBOARD -->

<div id="dashboard" style="display:none;">

    <div class="top-bar">

        <p>
            Logged in as:
            <strong id="userEmail"></strong>
        </p>

        <div class="button-row">

            <button
                type="button"
                class="refresh"
                id="refreshButton"
            >
                Refresh Tickets
            </button>

            <button
                type="button"
                class="logout"
                id="logoutButton"
            >
                Logout
            </button>

        </div>

        <p>
            Showing pending and accepted jobs only.
        </p>

        <div
            id="dashboardMessage"
            role="status"
            aria-live="polite"
        ></div>

    </div>

    <div
        id="tickets"
        aria-live="polite"
        aria-busy="false"
    >
        Loading tickets...
    </div>

</div>


<script type="module">

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";

import {
    getAuth,
    signInWithEmailAndPassword,
    signOut,
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

import {
    getFirestore,
    collection,
    getDocs,
    doc,
    updateDoc
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";


/* -----------------------------------------
   FIREBASE
----------------------------------------- */

const firebaseConfig = {

    apiKey: "AIzaSyCInoQ5IkCJwKcxCfhylLJOd1wHVQiefUE",

    authDomain: "worldoilllc.firebaseapp.com",

    projectId: "worldoilllc",

    storageBucket: "worldoilllc.appspot.com",

    messagingSenderId: "769325331754",

    appId: "1:769325331754:web:234d7c3ffa9a6424779a53"

};


const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getFirestore(app);


/* -----------------------------------------
   ELEMENTS
----------------------------------------- */

const loginBox =
    document.getElementById("loginBox");

const dashboard =
    document.getElementById("dashboard");

const ticketsDiv =
    document.getElementById("tickets");

const userEmail =
    document.getElementById("userEmail");

const loginForm =
    document.getElementById("loginForm");

const loginMessage =
    document.getElementById("loginMessage");

const dashboardMessage =
    document.getElementById("dashboardMessage");

const refreshButton =
    document.getElementById("refreshButton");

const logoutButton =
    document.getElementById("logoutButton");


/* -----------------------------------------
   LOGIN
----------------------------------------- */

loginForm.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();

        loginMessage.className = "";
        loginMessage.textContent = "";

        const email =
            document.getElementById("email").value.trim();

        const password =
            document.getElementById("password").value;

        try {

            await signInWithEmailAndPassword(
                auth,
                email,
                password
            );

        } catch (error) {

            console.error(
                "Firebase login error:",
                error
            );

            if (
                error.code === "auth/user-not-found" ||
                error.code === "auth/invalid-credential"
            ) {

                loginMessage.className = "error";

                loginMessage.textContent =
                    "The email or password is incorrect.";

            } else if (
                error.code === "auth/wrong-password"
            ) {

                loginMessage.className = "error";

                loginMessage.textContent =
                    "The password is incorrect.";

            } else if (
                error.code === "auth/invalid-email"
            ) {

                loginMessage.className = "error";

                loginMessage.textContent =
                    "Please enter a valid email address.";

            } else {

                loginMessage.className = "error";

                loginMessage.textContent =
                    "Login failed. Please try again.";

            }

        }

    }
);


/* -----------------------------------------
   LOGOUT
----------------------------------------- */

logoutButton.addEventListener(
    "click",
    async function() {

        await signOut(auth);

    }
);


/* -----------------------------------------
   AUTH STATE
----------------------------------------- */

onAuthStateChanged(
    auth,
    async function(user) {

        if (!user) {

            loginBox.style.display = "block";

            dashboard.style.display = "none";

            return;

        }


        /*
         * IMPORTANT:
         *
         * Force Firebase to refresh the ID token.
         * The Stripe webhook sets paidTechnician=true
         * as a Firebase custom claim.
         */

        const paid =
            await checkPaidTechnician(user);


        if (!paid) {

            dashboard.style.display = "none";

            loginBox.style.display = "block";

            loginMessage.className = "error";

            loginMessage.textContent =
                "Your account does not have an active technician subscription. Please complete your subscription payment.";

            await signOut(auth);

            return;

        }


        /* PAID TECHNICIAN */

        loginBox.style.display = "none";

        dashboard.style.display = "block";

        userEmail.textContent =
            user.email || "Technician";


        await loadTickets();

    }
);


/* -----------------------------------------
   CHECK PAID TECHNICIAN
----------------------------------------- */

async function checkPaidTechnician(user) {

    /*
     * Stripe webhook may take a few seconds
     * to update the Firebase custom claim.
     *
     * Try for approximately 30 seconds.
     */

    for (let attempt = 1; attempt <= 12; attempt++) {

        try {

            const tokenResult =
                await user.getIdTokenResult(true);

            const paid =
                tokenResult.claims.paidTechnician === true;

            if (paid) {

                return true;

            }

        } catch (error) {

            console.error(
                "Paid technician check failed:",
                error
            );

        }


        /*
         * Wait 2.5 seconds before trying again.
         */

        if (attempt < 12) {

            await new Promise(
                resolve => setTimeout(resolve, 2500)
            );

        }

    }

    return false;

}


/* -----------------------------------------
   REFRESH
----------------------------------------- */

refreshButton.addEventListener(
    "click",
    async function() {

        const user = auth.currentUser;

        if (!user) {

            return;

        }

        const paid =
            await checkPaidTechnician(user);

        if (!paid) {

            dashboardMessage.className = "error";

            dashboardMessage.textContent =
                "Your technician subscription is not active.";

            await signOut(auth);

            return;

        }

        await loadTickets();

    }
);


/* -----------------------------------------
   LOAD TICKETS
----------------------------------------- */

async function loadTickets() {

    ticketsDiv.setAttribute(
        "aria-busy",
        "true"
    );

    ticketsDiv.innerHTML =
        "<p>Loading tickets...</p>";

    dashboardMessage.className = "";

    dashboardMessage.textContent = "";


    try {

        const snapshot =
            await getDocs(
                collection(db, "oilChanges")
            );


        let tickets = [];


        snapshot.forEach(
            function(docSnap) {

                const data =
                    docSnap.data();

                const status =
                    data.status || "pending";


                if (
                    status === "pending" ||
                    status === "accepted"
                ) {

                    tickets.push({

                        id: docSnap.id,

                        ...data

                    });

                }

            }
        );


        tickets.sort(
            function(a, b) {

                return new Date(
                    b.createdAt || 0
                ) -
                new Date(
                    a.createdAt || 0
                );

            }
        );


        ticketsDiv.innerHTML = "";


        if (tickets.length === 0) {

            ticketsDiv.innerHTML =
                "<p class='empty'>No active tickets.</p>";

            return;

        }


        tickets.forEach(
            function(data) {

                const vehicle =
                    `${data.year || ""} ${data.make || ""} ${data.model || ""}`
                    .trim();


                const ticket =
                    document.createElement("article");

                ticket.className =
                    "ticket";


                const title =
                    document.createElement("h2");

                title.textContent =
                    "Ticket: " +
                    (data.ticketNumber || data.id);

                ticket.appendChild(title);


                const details =
                    document.createElement("div");


                addDetail(
                    details,
                    "Status:",
                    data.status || "pending",
                    true
                );

                addDetail(
                    details,
                    "Customer:",
                    data.name || "Not provided"
                );

                addDetail(
                    details,
                    "Phone:",
                    data.phone || "Not provided"
                );

                addDetail(
                    details,
                    "Vehicle:",
                    vehicle || "Not provided"
                );

                addDetail(
                    details,
                    "Date:",
                    data.rawDate ||
                    data.date ||
                    "Not provided"
                );

                addDetail(
                    details,
                    "Time:",
                    data.time ||
                    "Not provided"
                );


                ticket.appendChild(details);


                const actions =
                    document.createElement("div");

                actions.className =
                    "ticket-actions";


                const acceptButton =
                    createButton(
                        "Accept",
                        "accept",
                        function() {

                            updateStatus(
                                data.id,
                                "accepted"
                            );

                        }
                    );


                const completeButton =
                    createButton(
                        "Complete",
                        "complete",
                        function() {

                            updateStatus(
                                data.id,
                                "completed"
                            );

                        }
                    );


                const cancelButton =
                    createButton(
                        "Cancel",
                        "cancel",
                        function() {

                            updateStatus(
                                data.id,
                                "cancelled"
                            );

                        }
                    );


                actions.appendChild(
                    acceptButton
                );

                actions.appendChild(
                    completeButton
                );

                actions.appendChild(
                    cancelButton
                );


                ticket.appendChild(actions);

                ticketsDiv.appendChild(ticket);

            }
        );


    } catch (error) {

        console.error(
            "Firestore error:",
            error
        );


        ticketsDiv.innerHTML = `

            <div class="error">

                <strong>
                    Error loading tickets.
                </strong>

                <p>
                    Your account is signed in,
                    but the dashboard could not
                    read the oilChanges collection.
                </p>

                <p>
                    Make sure your Firebase
                    paid-technician security rules
                    are deployed.
                </p>

            </div>

        `;

    } finally {

        ticketsDiv.setAttribute(
            "aria-busy",
            "false"
        );

    }

}


/* -----------------------------------------
   ADD DETAIL
----------------------------------------- */

function addDetail(
    container,
    label,
    value,
    isStatus = false
) {

    const p =
        document.createElement("p");


    const strong =
        document.createElement("strong");

    strong.textContent =
        " " + label + " ";

    p.appendChild(strong);


    if (isStatus) {

        const span =
            document.createElement("span");

        span.className =
            "status";

        span.textContent =
            value;

        p.appendChild(span);

    } else {

        const text =
            document.createTextNode(value);

        p.appendChild(text);

    }


    container.appendChild(p);

}


/* -----------------------------------------
   CREATE BUTTON
----------------------------------------- */

function createButton(
    text,
    className,
    action
) {

    const button =
        document.createElement("button");

    button.type =
        "button";

    button.textContent =
        text;

    button.className =
        className;

    button.addEventListener(
        "click",
        action
    );

    return button;

}


/* -----------------------------------------
   UPDATE STATUS
----------------------------------------- */

async function updateStatus(
    id,
    status
) {

    const confirmation =
        confirm(
            "Change this appointment to " +
            status +
            "?"
        );


    if (!confirmation) {

        return;

    }


    try {

        const user =
            auth.currentUser;


        if (!user) {

            return;

        }


        /*
         * Verify paid status again before
         * allowing an appointment update.
         */

        const paid =
            await checkPaidTechnician(user);


        if (!paid) {

            dashboardMessage.className =
                "error";

            dashboardMessage.textContent =
                "Your technician subscription is not active.";

            await signOut(auth);

            return;

        }


        const updateData = {

            status: status,

            updatedAt:
                new Date().toISOString(),

            technicianEmail:
                user.email || "unknown"

        };


        if (status === "accepted") {

            updateData.technicianAcceptedAt =
                new Date().toISOString();

        }


        if (status === "completed") {

            updateData.completedAt =
                new Date().toISOString();

        }


        if (status === "cancelled") {

            updateData.cancelledAt =
                new Date().toISOString();

        }


        await updateDoc(
            doc(db, "oilChanges", id),
            updateData
        );


        dashboardMessage.className =
            "success";

        dashboardMessage.textContent =
            "Appointment updated successfully.";


        await loadTickets();


    } catch (error) {

        console.error(
            "Update error:",
            error
        );


        dashboardMessage.className =
            "error";

        dashboardMessage.textContent =
            "Could not update the appointment.";

    }

}

</script>
<script>
if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {

        navigator.serviceWorker.register("./service-worker.js")
            .then(function (registration) {

                console.log(
                    "World OIL service worker registered:",
                    registration.scope
                );

            })
            .catch(function (error) {

                console.error(
                    "World OIL service worker registration failed:",
                    error
                );

            });

    });
}
</script>
</body>
</html>
