<!DOCTYPE html>
<html>
<head>
  <title>World Oil Technician Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body { font-family: Arial, sans-serif; background:#f4f4f4; margin:0; padding:20px; }
    h1 { text-align:center; }
    .card, .ticket { background:white; max-width:650px; margin:15px auto; padding:18px; border-radius:12px; box-shadow:0 5px 15px rgba(0,0,0,0.15); }
    input { width:100%; padding:12px; margin:8px 0; font-size:16px; box-sizing:border-box; }
    button { padding:10px 14px; margin:5px; border:none; border-radius:6px; color:white; cursor:pointer; font-size:15px; }
    .login { background:#111; width:100%; }
    .logout, .cancel { background:#dc3545; }
    .refresh { background:#007bff; }
    .accept { background:#28a745; }
    .complete { background:#111; }
    .status { font-weight:bold; text-transform:uppercase; }
    .top-bar { max-width:650px; margin:0 auto 20px; text-align:center; }
    .error { color:red; text-align:center; font-weight:bold; }
    .empty { text-align:center; font-weight:bold; }
  </style>
</head>

<body>

<h1>World Oil Technician Dashboard</h1>

<div id="loginBox" class="card">
  <h2>Technician Login</h2>
  <p>Enter your technician password.</p>
  <input type="password" id="password" placeholder="Password" />
  <button class="login" onclick="login()">Login</button>
  <p id="loginMessage" class="error"></p>
</div>

<div id="dashboard" style="display:none;">
  <div class="top-bar">
    <p>Logged in as: <strong id="userEmail"></strong></p>
    <button class="refresh" onclick="loadTickets()">Refresh Tickets</button>
    <button class="logout" onclick="logout()">Logout</button>
    <p>Showing pending and accepted jobs only.</p>
  </div>

  <div id="tickets">Loading tickets...</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import {
  getAuth,
  signInWithEmailAndPassword,
  signOut,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import {
  getFirestore,
  collection,
  getDocs,
  doc,
  updateDoc
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCInoQ5IkCJwKcxCfhylLJOd1wHVQiefUE",
  authDomain: "worldoilllc.firebaseapp.com",
  projectId: "worldoilllc",
  storageBucket: "worldoilllc.appspot.com",
  messagingSenderId: "769325331754",
  appId: "1:769325331754:web:234d7c3ffa9a6424779a53"
};

const TECHNICIAN_EMAIL = "tech@worldoil.com";

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const loginBox = document.getElementById("loginBox");
const dashboard = document.getElementById("dashboard");
const ticketsDiv = document.getElementById("tickets");
const userEmail = document.getElementById("userEmail");

window.login = async function () {
  const password = document.getElementById("password").value;
  const loginMessage = document.getElementById("loginMessage");

  try {
    loginMessage.textContent = "";
    await signInWithEmailAndPassword(auth, TECHNICIAN_EMAIL, password);

    await signInWithEmailAndPassword(
      auth,
      TECHNICIAN_EMAIL,
      password
    );

  } catch (error) {
    loginMessage.textContent = "Incorrect password.";
    console.error("Firebase login error:", error);

    if (error.code === "auth/user-not-found") {
      loginMessage.textContent =
        "Technician account does not exist: " + TECHNICIAN_EMAIL;

    } else if (error.code === "auth/wrong-password") {
      loginMessage.textContent =
        "The password is incorrect.";

    } else if (error.code === "auth/invalid-credential") {
      loginMessage.textContent =
        "The email or password is incorrect.";

    } else if (error.code === "auth/operation-not-allowed") {
      loginMessage.textContent =
        "Email/Password login is not enabled in Firebase.";

    } else {
      loginMessage.textContent =
        "Login error: " + error.code;
    }
  }
};
