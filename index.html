<!DOCTYPE html>
<html>
<head>
    <title>World Oil Change</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background: url("https://cdn2.vectorstock.com/i/1000x1000/23/11/line-icon-of-a-car-and-oil-change-symbol-vector-40522311.jpg") center center no-repeat;
            background-size: 900px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            width: 340px;
            text-align: center;
        }

        h1 {
            font-size: 20px;
            margin-bottom: 15px;
        }

        input,
        select {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
            box-sizing: border-box;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: #111;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #111;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 8px;
        }

        button:hover {
            background: #333;
        }

        button:disabled {
            background: #777;
            cursor: not-allowed;
        }

        #message {
            display: none;
            margin-top: 12px;
            padding: 10px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: bold;
        }

        .error {
            display: block !important;
            color: #b00020;
            background: #ffe5e5;
        }

        .success {
            display: block !important;
            color: #146c2e;
            background: #e5f7e9;
        }

        .loading {
            display: block !important;
            color: #333;
            background: #eeeeee;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>World Oil Change</h1>

    <form id="bookingForm">

        <input
            type="text"
            id="name"
            placeholder="Full Name"
            autocomplete="name"
            maxlength="100"
            required
        >

        <input
            type="tel"
            id="phone"
            placeholder="Phone Number"
            autocomplete="tel"
            inputmode="tel"
            maxlength="20"
            required
        >

        <input
            type="number"
            id="year"
            placeholder="Vehicle Year"
            inputmode="numeric"
            min="1900"
            max="2026"
            required
        >

        <input
            type="text"
            id="make"
            placeholder="Vehicle Make"
            maxlength="50"
            required
        >

        <input
            type="text"
            id="model"
            placeholder="Vehicle Model"
            maxlength="50"
            required
        >

        <input
            type="date"
            id="date"
            required
        >

        <select id="time" required>
            <option value="">Select Time</option>
            <option value="08:00 AM">08:00 AM</option>
            <option value="08:30 AM">08:30 AM</option>
            <option value="09:00 AM">09:00 AM</option>
            <option value="09:30 AM">09:30 AM</option>
            <option value="10:00 AM">10:00 AM</option>
            <option value="10:30 AM">10:30 AM</option>
            <option value="11:00 AM">11:00 AM</option>
            <option value="11:30 AM">11:30 AM</option>
            <option value="12:00 PM">12:00 PM</option>
            <option value="12:30 PM">12:30 PM</option>
            <option value="01:00 PM">01:00 PM</option>
            <option value="01:30 PM">01:30 PM</option>
            <option value="02:00 PM">02:00 PM</option>
            <option value="02:30 PM">02:30 PM</option>
            <option value="03:00 PM">03:00 PM</option>
            <option value="03:30 PM">03:30 PM</option>
            <option value="04:00 PM">04:00 PM</option>
            <option value="04:30 PM">04:30 PM</option>
            <option value="05:00 PM">05:00 PM</option>
        </select>

        <button type="submit" id="submitButton">
            Submit Request
        </button>

        <div id="message"></div>

    </form>

</div>

<script>

const form = document.getElementById("bookingForm");
const submitButton = document.getElementById("submitButton");
const message = document.getElementById("message");


// --------------------------------------------------
// SET MINIMUM DATE TO TODAY
// --------------------------------------------------

const today = new Date();

const yyyy = today.getFullYear();
const mm = String(today.getMonth() + 1).padStart(2, "0");
const dd = String(today.getDate()).padStart(2, "0");

const todayString = `${yyyy}-${mm}-${dd}`;

document.getElementById("date").min = todayString;


// --------------------------------------------------
// NORMALIZE PHONE NUMBER
// --------------------------------------------------

function normalizePhone(phone) {

    return phone.replace(/\D/g, "");

}


// --------------------------------------------------
// VALIDATE PHONE
// --------------------------------------------------

function isValidPhone(phone) {

    const digits = normalizePhone(phone);

    return digits.length === 10;

}


// --------------------------------------------------
// SHOW MESSAGE
// --------------------------------------------------

function showMessage(text, type) {

    message.textContent = text;

    message.className = type;

}


// --------------------------------------------------
// SUBMIT BOOKING
// --------------------------------------------------

form.addEventListener("submit", async function(e) {

    e.preventDefault();


    // Clear old message
    showMessage("", "");


    // --------------------------------------------------
    // CHECK REQUIRED FIELDS
    // --------------------------------------------------

    if (!form.checkValidity()) {

        form.reportValidity();

        showMessage(
            "Please fill out all required fields.",
            "error"
        );

        return;
    }


    // --------------------------------------------------
    // GET VALUES
    // --------------------------------------------------

    const name =
        document.getElementById("name").value.trim();

    const phone =
        document.getElementById("phone").value.trim();

    const year =
        document.getElementById("year").value.trim();

    const make =
        document.getElementById("make").value.trim();

    const model =
        document.getElementById("model").value.trim();

    const rawDate =
        document.getElementById("date").value;

    const time =
        document.getElementById("time").value;


    // --------------------------------------------------
    // NAME VALIDATION
    // --------------------------------------------------

    if (name.length < 2) {

        showMessage(
            "Please enter your full name.",
            "error"
        );

        return;
    }


    // --------------------------------------------------
    // PHONE VALIDATION
    // --------------------------------------------------

    const normalizedPhone = normalizePhone(phone);

    if (normalizedPhone.length !== 10) {

        showMessage(
            "Please enter a valid 10-digit phone number.",
            "error"
        );

        return;
    }


    // --------------------------------------------------
    // YEAR VALIDATION
    // --------------------------------------------------

    const vehicleYear = Number(year);

    if (
        !Number.isInteger(vehicleYear) ||
        vehicleYear < 1900 ||
        vehicleYear > 2026
    ) {

        showMessage(
            "Please enter a valid vehicle year.",
            "error"
        );

        return;
    }


    // --------------------------------------------------
    // VEHICLE VALIDATION
    // --------------------------------------------------

    if (!make || !model) {

        showMessage(
            "Please enter the vehicle make and model.",
            "error"
        );

        return;
    }


    // --------------------------------------------------
    // DATE VALIDATION
    // --------------------------------------------------

    if (!rawDate) {

        showMessage(
            "Please select a date.",
            "error"
        );

        return;
    }


    if (rawDate < todayString) {

        showMessage(
            "Please select today or a future date.",
            "error"
        );

        return;
    }


    // --------------------------------------------------
    // TIME VALIDATION
    // --------------------------------------------------

    if (!time) {

        showMessage(
            "Please select a time.",
            "error"
        );

        return;
    }


    // --------------------------------------------------
    // DATA SENT TO BACKEND
    // --------------------------------------------------

    const data = {

        name: name,

        phone: normalizedPhone,

        year: vehicleYear,

        make: make,

        model: model,

        rawDate: rawDate,

        time: time

    };


    // --------------------------------------------------
    // PREVENT DOUBLE SUBMISSION
    // --------------------------------------------------

    submitButton.disabled = true;

    submitButton.textContent = "Submitting...";

    showMessage(
        "Submitting your request...",
        "loading"
    );


    // --------------------------------------------------
    // SEND TO RENDER
    // --------------------------------------------------

    const controller = new AbortController();

    const timeout = setTimeout(function() {

        controller.abort();

    }, 15000);


    try {

        const response = await fetch(

            "https://worldoil-render-backend.onrender.com/book",

            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify(data),

                signal: controller.signal
            }

        );


        clearTimeout(timeout);


        // --------------------------------------------------
        // READ RESPONSE
        // --------------------------------------------------

        let result = {};

        try {

            result = await response.json();

        } catch {

            result = {};

        }


        // --------------------------------------------------
        // BACKEND REJECTED REQUEST
        // --------------------------------------------------

        if (!response.ok) {

            showMessage(

                result.error ||
                "This request could not be submitted.",

                "error"

            );

            return;
        }


        // --------------------------------------------------
        // SUCCESS
        // --------------------------------------------------

        showMessage(

            "Request submitted successfully!",

            "success"

        );


        form.reset();


        // Put minimum date back after reset
        document.getElementById("date").min = todayString;


    } catch (error) {

        clearTimeout(timeout);

        console.error(
            "Booking error:",
            error
        );


        if (error.name === "AbortError") {

            showMessage(

                "The server took too long to respond. Please try again.",

                "error"

            );

        } else {

            showMessage(

                "Could not submit request. Please try again.",

                "error"

            );

        }


    } finally {

        submitButton.disabled = false;

        submitButton.textContent = "Submit Request";

    }

});

</script>

</body>
</html>
