<head>
    <title>World Oil Change</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            margin: 0;

            background: #777;

            display: block !important;

</head>

<body>

<div class="container">

    <h1>World Oil Change</h1>

    <form id="bookingForm" novalidate>

        <input
            type="text"
            id="name"
            placeholder="Full Name"
            autocomplete="name"
            maxlength="100"
            required
        >

        <input
            type="tel"
            id="phone"
            placeholder="Phone Number"
            autocomplete="tel"
            inputmode="tel"
            maxlength="20"
            required
        >

        <input
            type="number"
            id="year"
            placeholder="Vehicle Year"
            inputmode="numeric"
            min="1900"
            max="2026"
            required
        >

        <input
            type="text"
            id="make"
            placeholder="Vehicle Make"
            maxlength="50"
            required
        >

        <input
            type="text"
            id="model"
            placeholder="Vehicle Model"
            maxlength="50"
            required
        >

        <input
            type="date"
            id="date"
            required
        >

        <select id="time" required>
            <option value="">Select Time</option>
            <option>08:00 AM</option>
            <option>08:30 AM</option>
            <option>09:00 AM</option>
            <option>09:30 AM</option>
            <option>10:00 AM</option>
            <option>10:30 AM</option>
            <option>11:00 AM</option>
            <option>11:30 AM</option>
            <option>12:00 PM</option>
            <option>12:30 PM</option>
            <option>01:00 PM</option>
            <option>01:30 PM</option>
            <option>02:00 PM</option>
            <option>02:30 PM</option>
            <option>03:00 PM</option>
            <option>03:30 PM</option>
            <option>04:00 PM</option>
            <option>04:30 PM</option>
            <option>05:00 PM</option>
        </select>

        <button type="submit" id="submitButton">
            Submit Request
        </button>

        <div id="message"></div>

    </form>

</div>

<script>

const form = document.getElementById("bookingForm");
const submitButton = document.getElementById("submitButton");
const message = document.getElementById("message");


// Set today's date as the minimum date
const today = new Date();
const yyyy = today.getFullYear();
const mm = String(today.getMonth() + 1).padStart(2, "0");
const dd = String(today.getDate()).padStart(2, "0");

document.getElementById("date").min = `${yyyy}-${mm}-${dd}`;


// Format phone number for duplicate checking
function normalizePhone(phone) {
    return phone.replace(/\D/g, "");
}


// Validate phone number
function isValidPhone(phone) {
    const digits = normalizePhone(phone);

    return digits.length === 10;
}


// Show message
function showMessage(text, type) {
    message.textContent = text;
    message.className = type;
}


// Submit booking
form.addEventListener("submit", async (e) => {

    e.preventDefault();

    showMessage("", "");

    // Check every required field
    if (!form.checkValidity()) {
        form.reportValidity();

        showMessage(
            "Please fill out every required field.",
            "error"
        );

        return;
    }


    const name = document.getElementById("name").value.trim();
    const phone = document.getElementById("phone").value.trim();
    const year = document.getElementById("year").value.trim();
    const make = document.getElementById("make").value.trim();
    const model = document.getElementById("model").value.trim();
    const rawDate = document.getElementById("date").value;
    const time = document.getElementById("time").value;


    // Check name
    if (name.length < 2) {
        showMessage(
            "Please enter your full name.",
            "error"
        );
        return;
    }


    // Check phone
    if (!isValidPhone(phone)) {
        showMessage(
            "Please enter a valid 10-digit phone number.",
            "error"
        );
        return;
    }


    // Check vehicle year
    const vehicleYear = Number(year);

    if (
        !Number.isInteger(vehicleYear) ||
        vehicleYear < 1900 ||
        vehicleYear > 2026
    ) {
        showMessage(
            "Please enter a valid vehicle year.",
            "error"
        );
        return;
    }


    // Make sure vehicle information exists
    if (!make || !model) {
        showMessage(
            "Please enter the vehicle make and model.",
            "error"
        );
        return;
    }


    // Make sure date exists
    if (!rawDate) {
        showMessage(
            "Please select a date.",
            "error"
        );
        return;
    }


    // Make sure time exists
    if (!time) {
        showMessage(
            "Please select a time.",
            "error"
        );
        return;
    }


    // Prepare booking
    const data = {
        name: name,
        phone: normalizePhone(phone),
        year: vehicleYear,
        make: make,
        model: model,
        rawDate: rawDate,
        time: time
    };


    // Prevent double-click/multiple submissions
    submitButton.disabled = true;
    submitButton.textContent = "Checking...";


    try {

        const response = await fetch(
            "https://worldoil-render-backend.onrender.com/book",
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify(data)
            }
        );


        let result = {};

        try {
            result = await response.json();
        } catch {
            result = {};
        }


        // Backend rejected request
        if (!response.ok) {

            showMessage(
                result.error ||
                "This request could not be submitted.",
                "error"
            );

            return;
        }


        // Successful booking
        showMessage(
            "Request submitted successfully!",
            "success"
        );

        form.reset();


    } catch (error) {

        console.error("Booking error:", error);

        showMessage(
            "Could not submit request. Please try again.",
            "error"
        );

    } finally {

        submitButton.disabled = false;
        submitButton.textContent = "Submit Request";

    }

});

</script>

</body>
</html>
