    <style>

<body>

<div class="container">

    <h1>World Oil Technician Dashboard</h1>

    <div id="authMessage" class="message" style="display:none;"></div>

    <div id="dashboard" style="display:none;">

        <div class="top-bar">

            <div>
                <p class="account">
                    Logged in as:
                    <strong id="userEmail"></strong>
                </p>
            </div>

            <div>
                <button
                    type="button"
                    class="refresh"
                    id="refreshButton"
                >
                    Refresh Jobs
                </button>

                <button
                    type="button"
                    class="logout"
                    id="logoutButton"
                >
                    Logout
                </button>
            </div>

        </div>

        <div
            id="dashboardMessage"
            class="message"
            style="display:none;"
        ></div>

        <div
            id="tickets"
            aria-live="polite"
        >
            <div class="loading">
                Loading jobs...
            </div>
        </div>

    </div>

</div>


<script type="module">

    // =========================================
    // FIREBASE
    // =========================================

    import {
        initializeApp
    } from
    "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";


    import {
        getAuth,
        onAuthStateChanged,
        signOut
    } from
    "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";


    import {
        getFirestore,
        collection,
        getDocs,
        doc,
        updateDoc
    } from
    "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";


    const firebaseConfig = {

        apiKey:
            "AIzaSyCInoQ5IkCJwKcxCfhylLJOd1wHVQiefUE",

        authDomain:
            "worldoilllc.firebaseapp.com",

        projectId:
            "worldoilllc",

        storageBucket:
            "worldoilllc.appspot.com",

        messagingSenderId:
            "769325331754",

        appId:
            "1:769325331754:web:234d7c3ffa9a6424779a53"
    };


    const app =
        initializeApp(firebaseConfig);


    const auth =
        getAuth(app);


    const db =
        getFirestore(app);


    // =========================================
    // SETTINGS
    // =========================================

    const SIGNUP_URL =
        "https://alonso121104.github.io/WorldOILLLC/technician-signup.html";


    // =========================================
    // ELEMENTS
    // =========================================

    const dashboard =
        document.getElementById("dashboard");


    const ticketsDiv =
        document.getElementById("tickets");


    const userEmail =
        document.getElementById("userEmail");


    const refreshButton =
        document.getElementById("refreshButton");


    const logoutButton =
        document.getElementById("logoutButton");


    const authMessage =
        document.getElementById("authMessage");


    const dashboardMessage =
        document.getElementById("dashboardMessage");


    // =========================================
    // SHOW MESSAGE
    // =========================================

    function showAuthMessage(
        message,
        type = "error"
    ) {

        authMessage.textContent =
            message;

        authMessage.className =
            "message " + type;

        authMessage.style.display =
            "block";
    }


    function showDashboardMessage(
        message,
        type = "success"
    ) {

        dashboardMessage.textContent =
            message;

        dashboardMessage.className =
            "message " + type;

        dashboardMessage.style.display =
            "block";
    }


    // =========================================
    // SECURITY CHECK
    // =========================================

    onAuthStateChanged(
        auth,
        async function(user) {

            // ---------------------------------
            // NO LOGIN
            // ---------------------------------

            if (!user) {

                dashboard.style.display =
                    "none";

                window.location.replace(
                    SIGNUP_URL
                );

                return;
            }


            // ---------------------------------
            // CHECK PAID STATUS
            // ---------------------------------

            try {

                const tokenResult =
                    await user.getIdTokenResult(
                        true
                    );


                const paidTechnician =
                    tokenResult.claims
                        .paidTechnician === true;


                // ---------------------------------
                // USER HAS NOT PAID
                // ---------------------------------

                if (!paidTechnician) {

                    await signOut(auth);

                    window.location.replace(
                        SIGNUP_URL
                    );

                    return;
                }


                // ---------------------------------
                // USER IS PAID
                // ---------------------------------

                dashboard.style.display =
                    "block";

                authMessage.style.display =
                    "none";

                userEmail.textContent =
                    user.email || "Technician";

                await loadTickets();

            }

            catch (error) {

                console.error(
                    "Authorization error:",
                    error
                );

                await signOut(auth);

                window.location.replace(
                    SIGNUP_URL
                );
            }

        }
    );


    // =========================================
    // LOGOUT
    // =========================================

    logoutButton.addEventListener(
        "click",
        async function() {

            try {

                await signOut(auth);

                window.location.replace(
                    SIGNUP_URL
                );

            }

            catch (error) {

                console.error(
                    "Logout error:",
                    error
                );
            }
        }
    );


    // =========================================
    // REFRESH
    // =========================================

    refreshButton.addEventListener(
        "click",
        async function() {

            dashboardMessage.style.display =
                "none";

            await loadTickets();
        }
    );


    // =========================================
    // LOAD JOBS
    // =========================================

    async function loadTickets() {

        ticketsDiv.innerHTML = `
            <div class="loading">
                Loading jobs...
            </div>
        `;


        try {

            // ---------------------------------
            // CHECK USER
            // ---------------------------------

            const user =
                auth.currentUser;


            if (!user) {

                window.location.replace(
                    SIGNUP_URL
                );

                return;
            }


            // ---------------------------------
            // CHECK PAID CLAIM AGAIN
            // ---------------------------------

            const tokenResult =
                await user.getIdTokenResult(
                    true
                );


            if (
                tokenResult.claims
                    .paidTechnician !== true
            ) {

                await signOut(auth);

                window.location.replace(
                    SIGNUP_URL
                );

                return;
            }


            // ---------------------------------
            // GET APPOINTMENTS
            // ---------------------------------

            const snapshot =
                await getDocs(
                    collection(
                        db,
                        "oilChanges"
                    )
                );


            const tickets = [];


            snapshot.forEach(
                function(docSnap) {

                    const data =
                        docSnap.data();


                    const status =
                        data.status ||
                        "pending";


                    if (
                        status === "pending" ||
                        status === "accepted"
                    ) {

                        tickets.push({

                            id:
                                docSnap.id,

                            ...data
                        });
                    }

                }
            );


            // ---------------------------------
            // SORT NEWEST FIRST
            // ---------------------------------

            tickets.sort(
                function(a, b) {

                    return (
                        new Date(
                            b.createdAt || 0
                        ) -
                        new Date(
                            a.createdAt || 0
                        )
                    );
                }
            );


            // ---------------------------------
            // NO JOBS
            // ---------------------------------

            if (
                tickets.length === 0
            ) {

                ticketsDiv.innerHTML = `
                    <div class="empty">
                        <strong>
                            No active jobs.
                        </strong>

                        <p>
                            There are currently no pending or accepted appointments.
                        </p>
                    </div>
                `;

                return;
            }


            // ---------------------------------
            // DISPLAY JOBS
            // ---------------------------------

            ticketsDiv.innerHTML = "";


            tickets.forEach(
                function(data) {

                    const ticket =
                        document.createElement(
                            "article"
                        );


                    ticket.className =
                        "ticket";


                    const vehicle =
                        `${data.year || ""} ${data.make || ""} ${data.model || ""}`
                        .trim();


                    const ticketNumber =
                        data.ticketNumber ||
                        data.id;


                    ticket.innerHTML = `

                        <h2>
                            Job #${escapeHtml(
                                ticketNumber
                            )}
                        </h2>

                        <p>
                            <strong>Status:</strong>
                            <span class="status">
                                ${escapeHtml(
                                    data.status ||
                                    "pending"
                                )}
                            </span>
                        </p>

                        <p>
                            <strong>Customer:</strong>
                            ${escapeHtml(
                                data.name ||
                                "Not provided"
                            )}
                        </p>

                        <p>
                            <strong>Phone:</strong>
                            ${escapeHtml(
                                data.phone ||
                                "Not provided"
                            )}
                        </p>

                        <p>
                            <strong>Vehicle:</strong>
                            ${escapeHtml(
                                vehicle ||
                                "Not provided"
                            )}
                        </p>

                        <p>
                            <strong>Date:</strong>
                            ${escapeHtml(
                                data.rawDate ||
                                data.date ||
                                "Not provided"
                            )}
                        </p>

                        <p>
                            <strong>Time:</strong>
                            ${escapeHtml(
                                data.time ||
                                "Not provided"
                            )}
                        </p>

                        <div class="ticket-actions">

                            <button
                                type="button"
                                class="accept"
                                data-id="${escapeHtml(
                                    data.id
                                )}"
                                data-status="accepted"
                            >
                                Accept
                            </button>

                            <button
                                type="button"
                                class="complete"
                                data-id="${escapeHtml(
                                    data.id
                                )}"
                                data-status="completed"
                            >
                                Complete
                            </button>

                            <button
                                type="button"
                                class="cancel"
                                data-id="${escapeHtml(
                                    data.id
                                )}"
                                data-status="cancelled"
                            >
                                Cancel
                            </button>

                        </div>
                    `;


                    ticketsDiv.appendChild(
                        ticket
                    );


                    const buttons =
                        ticket.querySelectorAll(
                            "button"
                        );


                    buttons.forEach(
                        function(button) {

                            button.addEventListener(
                                "click",
                                function() {

                                    updateStatus(
                                        button.dataset.id,
                                        button.dataset.status
                                    );
                                }
                            );
                        }
                    );

                }
            );

        }

        catch (error) {

            console.error(
                "Firestore error:",
                error
            );


            ticketsDiv.innerHTML = `
                <div class="message error">

                    <strong>
                        Unable to load jobs.
                    </strong>

                    <p>
                        Your account may not have technician access yet.
                    </p>

                </div>
            `;
        }
    }


    // =========================================
    // UPDATE JOB STATUS
    // =========================================

    async function updateStatus(
        id,
        status
    ) {

        const confirmation =
            confirm(
                "Change this appointment to " +
                status +
                "?"
            );


        if (!confirmation) {
            return;
        }


        try {

            const user =
                auth.currentUser;


            if (!user) {

                window.location.replace(
                    SIGNUP_URL
                );

                return;
            }


            // ---------------------------------
            // VERIFY PAYMENT AGAIN
            // ---------------------------------

            const tokenResult =
                await user.getIdTokenResult(
                    true
                );


            if (
                tokenResult.claims
                    .paidTechnician !== true
            ) {

                await signOut(auth);

                window.location.replace(
                    SIGNUP_URL
                );

                return;
            }


            // ---------------------------------
            // UPDATE DATA
            // ---------------------------------

            const updateData = {

                status:
                    status,

                updatedAt:
                    new Date().toISOString(),

                technicianEmail:
                    user.email ||
                    "unknown"
            };


            if (
                status === "accepted"
            ) {

                updateData
                    .technicianAcceptedAt =
                    new Date()
                        .toISOString();
            }


            if (
                status === "completed"
            ) {

                updateData.completedAt =
                    new Date()
                        .toISOString();
            }


            if (
                status === "cancelled"
            ) {

                updateData.cancelledAt =
                    new Date()
                        .toISOString();
            }


            await updateDoc(
                doc(
                    db,
                    "oilChanges",
                    id
                ),
                updateData
            );


            showDashboardMessage(
                "Appointment updated successfully.",
                "success"
            );


            await loadTickets();

        }

        catch (error) {

            console.error(
                "Update error:",
                error
            );


            showDashboardMessage(
                "Could not update the appointment.",
                "error"
            );
        }
    }


    // =========================================
    // HTML ESCAPE
    // =========================================

    function escapeHtml(value) {

        return String(value)
            .replaceAll("&", "&amp;")
            .replaceAll("<", "&lt;")
            .replaceAll(">", "&gt;")
            .replaceAll('"', "&quot;")
            .replaceAll("'", "&#039;");
    }

</script>

</body>
</html>
