<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>World Oil Change - Book an Appointment</title>

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;

            background:
                url("https://cdn2.vectorstock.com/i/1000x1000/23/11/line-icon-of-a-car-and-oil-change-symbol-vector-40522311.jpg")
                center center
                no-repeat;

            background-size: 900px;

            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            color: #111;
        }

        .container {
            background: rgba(255, 255, 255, 0.97);

            padding: 25px;

            border-radius: 12px;

            box-shadow:
                0 10px 30px rgba(0,0,0,0.3);

            width: 100%;
            max-width: 380px;

            text-align: left;
        }

        h1 {
            font-size: 24px;
            text-align: center;
            margin: 0 0 20px;
        }

        .instructions {
            text-align: center;
            margin-bottom: 20px;
            line-height: 1.5;
        }

        .field {
            margin-bottom: 14px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 6px;
        }

        .required {
            font-weight: normal;
        }

        input,
        select {
            width: 100%;

            padding: 12px;

            border: 2px solid #777;

            border-radius: 6px;

            font-size: 16px;

            background: white;
            color: #111;
        }

        input:focus,
        select:focus,
        button:focus {
            outline: 3px solid #005fcc;
            outline-offset: 2px;
            border-color: #111;
        }

        input:invalid:not(:placeholder-shown),
        select:invalid {
            border-color: #b00020;
        }

        .help {
            display: block;
            margin-top: 4px;
            font-size: 13px;
        }

        button {
            width: 100%;

            padding: 13px;

            background: #111;
            color: white;

            border: none;
            border-radius: 6px;

            cursor: pointer;

            font-size: 16px;
            font-weight: bold;

            margin-top: 8px;
        }

        button:hover {
            background: #333;
        }

        button:disabled {
            background: #666;
            cursor: not-allowed;
        }

        #message {
            margin-top: 15px;
            padding: 12px;

            border-radius: 6px;

            font-size: 15px;
            font-weight: bold;

            display: none;
        }

        .error {
            display: block !important;

            color: #8b0000;
            background: #ffe5e5;

            border: 2px solid #b00020;
        }

        .success {
            display: block !important;

            color: #145c2a;
            background: #e5f7e9;

            border: 2px solid #217a3c;
        }

        .loading {
            display: block !important;

            color: #111;
            background: #eeeeee;

            border: 2px solid #777;
        }

        @media (max-width: 500px) {

            body {
                padding: 10px;
                align-items: flex-start;
            }

            .container {
                margin-top: 10px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            * {
                scroll-behavior: auto !important;
                transition: none !important;
                animation: none !important;
            }
        }
    </style>
</head>

<body>

<main class="container">

    <h1>World Oil Change</h1>

    <p class="instructions">
        Complete all required fields to request an oil change appointment.
        <span class="required">All fields are required.</span>
    </p>

    <form id="bookingForm" novalidate>

        <!-- NAME -->
        <div class="field">
            <label for="name">
                Full Name <span aria-hidden="true">*</span>
            </label>

            <input
                type="text"
                id="name"
                name="name"
                autocomplete="name"
                maxlength="100"
                required
                aria-required="true"
            >
        </div>

        <!-- PHONE -->
        <div class="field">
            <label for="phone">
                Phone Number <span aria-hidden="true">*</span>
            </label>

            <input
                type="tel"
                id="phone"
                name="phone"
                autocomplete="tel"
                inputmode="tel"
                maxlength="20"
                required
                aria-required="true"
                aria-describedby="phoneHelp"
            >

            <span id="phoneHelp" class="help">
                Enter a 10-digit phone number.
            </span>
        </div>

        <!-- YEAR -->
        <div class="field">
            <label for="year">
                Vehicle Year <span aria-hidden="true">*</span>
            </label>

            <input
                type="number"
                id="year"
                name="year"
                inputmode="numeric"
                min="1900"
                max="2026"
                required
                aria-required="true"
            >
        </div>

        <!-- MAKE -->
        <div class="field">
            <label for="make">
                Vehicle Make <span aria-hidden="true">*</span>
            </label>

            <input
                type="text"
                id="make"
                name="make"
                maxlength="50"
                placeholder="Toyota"
                required
                aria-required="true"
            >
        </div>

        <!-- MODEL -->
        <div class="field">
            <label for="model">
                Vehicle Model <span aria-hidden="true">*</span>
            </label>

            <input
                type="text"
                id="model"
                name="model"
                maxlength="50"
                placeholder="Camry"
                required
                aria-required="true"
            >
        </div>

        <!-- DATE -->
        <div class="field">
            <label for="date">
                Appointment Date <span aria-hidden="true">*</span>
            </label>

            <input
                type="date"
                id="date"
                name="date"
                required
                aria-required="true"
            >
        </div>

        <!-- TIME -->
        <div class="field">
            <label for="time">
                Appointment Time <span aria-hidden="true">*</span>
            </label>

            <select
                id="time"
                name="time"
                required
                aria-required="true"
            >

                <option value="">
                    Select a time
                </option>

                <option value="08:00 AM">08:00 AM</option>
                <option value="08:30 AM">08:30 AM</option>
                <option value="09:00 AM">09:00 AM</option>
                <option value="09:30 AM">09:30 AM</option>
                <option value="10:00 AM">10:00 AM</option>
                <option value="10:30 AM">10:30 AM</option>
                <option value="11:00 AM">11:00 AM</option>
                <option value="11:30 AM">11:30 AM</option>
                <option value="12:00 PM">12:00 PM</option>
                <option value="12:30 PM">12:30 PM</option>
                <option value="01:00 PM">01:00 PM</option>
                <option value="01:30 PM">01:30 PM</option>
                <option value="02:00 PM">02:00 PM</option>
                <option value="02:30 PM">02:30 PM</option>
                <option value="03:00 PM">03:00 PM</option>
                <option value="03:30 PM">03:30 PM</option>
                <option value="04:00 PM">04:00 PM</option>
                <option value="04:30 PM">04:30 PM</option>
                <option value="05:00 PM">05:00 PM</option>

            </select>
        </div>

        <button
            type="submit"
            id="submitButton"
        >
            Submit Request
        </button>

        <div
            id="message"
            role="status"
            aria-live="polite"
            aria-atomic="true"
        ></div>

    </form>

</main>


<script>

const form =
    document.getElementById("bookingForm");

const submitButton =
    document.getElementById("submitButton");

const message =
    document.getElementById("message");


// -----------------------------------------
// TODAY'S DATE
// -----------------------------------------

function getTodayString() {

    const today = new Date();

    const yyyy =
        today.getFullYear();

    const mm =
        String(today.getMonth() + 1)
        .padStart(2, "0");

    const dd =
        String(today.getDate())
        .padStart(2, "0");

    return `${yyyy}-${mm}-${dd}`;
}

const todayString =
    getTodayString();

document.getElementById("date").min =
    todayString;


// -----------------------------------------
// PHONE
// -----------------------------------------

function normalizePhone(phone) {

    return phone.replace(/\D/g, "");

}


// -----------------------------------------
// MESSAGE
// -----------------------------------------

function showMessage(text, type) {

    message.textContent = text;

    message.className = type || "";

}


// -----------------------------------------
// SUBMIT
// -----------------------------------------

form.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();

        showMessage("", "");


        // Required fields

        if (!form.checkValidity()) {

            form.reportValidity();

            showMessage(
                "Please fill out all required fields.",
                "error"
            );

            return;
        }


        // Values

        const name =
            document.getElementById("name")
            .value.trim();

        const phone =
            document.getElementById("phone")
            .value.trim();

        const year =
            document.getElementById("year")
            .value.trim();

        const make =
            document.getElementById("make")
            .value.trim();

        const model =
            document.getElementById("model")
            .value.trim();

        const rawDate =
            document.getElementById("date")
            .value;

        const time =
            document.getElementById("time")
            .value;


        // Name

        if (name.length < 2) {

            showMessage(
                "Please enter your full name.",
                "error"
            );

            document.getElementById("name").focus();

            return;
        }


        // Phone

        const normalizedPhone =
            normalizePhone(phone);

        if (normalizedPhone.length !== 10) {

            showMessage(
                "Please enter a valid 10-digit phone number.",
                "error"
            );

            document.getElementById("phone").focus();

            return;
        }


        // Year

        const vehicleYear =
            Number(year);

        if (
            !Number.isInteger(vehicleYear) ||
            vehicleYear < 1900 ||
            vehicleYear > 2026
        ) {

            showMessage(
                "Please enter a valid vehicle year.",
                "error"
            );

            document.getElementById("year").focus();

            return;
        }


        // Date

        if (!rawDate) {

            showMessage(
                "Please select an appointment date.",
                "error"
            );

            document.getElementById("date").focus();

            return;
        }


        if (rawDate < todayString) {

            showMessage(
                "Please select today or a future date.",
                "error"
            );

            document.getElementById("date").focus();

            return;
        }


        // Time

        if (!time) {

            showMessage(
                "Please select an appointment time.",
                "error"
            );

            document.getElementById("time").focus();

            return;
        }


        // Data

        const data = {

            name: name,

            phone: normalizedPhone,

            year: vehicleYear,

            make: make,

            model: model,

            rawDate: rawDate,

            time: time

        };


        // Disable button

        submitButton.disabled = true;

        submitButton.textContent =
            "Submitting...";

        showMessage(
            "Submitting your appointment request...",
            "loading"
        );


        const controller =
            new AbortController();

        const timeout =
            setTimeout(
                () => controller.abort(),
                15000
            );


        try {

            const response =
                await fetch(
                    "https://worldoil-render-backend.onrender.com/book",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body:
                            JSON.stringify(data),

                        signal:
                            controller.signal
                    }
                );


            clearTimeout(timeout);


            let result = {};

            try {

                result =
                    await response.json();

            } catch {

                result = {};

            }


            if (!response.ok) {

                showMessage(
                    result.error ||
                    "Your appointment could not be submitted.",
                    "error"
                );

                return;
            }


            showMessage(
                "Your appointment request was submitted successfully.",
                "success"
            );


            form.reset();

            document.getElementById("date").min =
                getTodayString();


        } catch (error) {

            clearTimeout(timeout);

            console.error(error);


            if (
                error.name ===
                "AbortError"
            ) {

                showMessage(
                    "The server took too long to respond. Please try again.",
                    "error"
                );

            } else {

                showMessage(
                    "Could not submit your request. Please try again.",
                    "error"
                );

            }

        } finally {

            submitButton.disabled = false;

            submitButton.textContent =
                "Submit Request";

        }

    }
);

</script>

</body>
</html>
