<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>World Oil Technician Dashboard</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      margin: 0;
      padding: 0;
    }

    header {
      background: #111;
      color: white;
      padding: 20px;
      text-align: center;
    }

    .container {
      max-width: 1100px;
      margin: 30px auto;
      padding: 20px;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      flex-wrap: wrap;
      gap: 10px;
    }

    button {
      border: none;
      padding: 10px 15px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }

    .logout-btn {
      background: #d32f2f;
      color: white;
    }

    .refresh-btn {
      background: #1976d2;
      color: white;
    }

    .job {
      background: white;
      border-radius: 10px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .job h3 {
      margin-top: 0;
    }

    .job p {
      margin: 7px 0;
    }

    .status {
      display: inline-block;
      padding: 6px 10px;
      border-radius: 5px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .pending {
      background: #fff3cd;
      color: #856404;
    }

    .accepted {
      background: #d1ecf1;
      color: #0c5460;
    }

    .completed {
      background: #d4edda;
      color: #155724;
    }

    .cancelled {
      background: #f8d7da;
      color: #721c24;
    }

    .actions {
      margin-top: 15px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .accept-btn {
      background: #2e7d32;
      color: white;
    }

    .complete-btn {
      background: #1565c0;
      color: white;
    }

    .cancel-btn {
      background: #c62828;
      color: white;
    }

    #loading {
      text-align: center;
      padding: 30px;
      font-size: 18px;
    }

    #message {
      background: white;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 20px;
      display: none;
    }
  </style>
</head>

<body>

<header>
  <h1>World Oil Technician Dashboard</h1>
</header>

<div class="container">

  <div class="top-bar">
    <div>
      <strong id="technicianEmail"></strong>
    </div>

    <div>
      <button class="refresh-btn" id="refreshBtn">
        Refresh Jobs
      </button>

      <button class="logout-btn" id="logoutBtn">
        Logout
      </button>
    </div>
  </div>

  <div id="message"></div>

  <div id="loading">
    Loading jobs...
  </div>

  <div id="jobs"></div>

</div>

<script type="module">

  import {
    initializeApp
  } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";

  import {
    getAuth,
    onAuthStateChanged,
    signOut
  } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

  import {
    getFirestore,
    collection,
    getDocs,
    doc,
    updateDoc,
    serverTimestamp
  } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";


  const firebaseConfig = {
    apiKey: "AIzaSyCInoQ5IkCJwKcxCfhylLJOd1wHVQiefUE",
    authDomain: "worldoilllc.firebaseapp.com",
    projectId: "worldoilllc",
    storageBucket: "worldoilllc.appspot.com",
    messagingSenderId: "769325331754",
    appId: "1:769325331754:web:234d7c3ffa9a6424779a53"
  };


  const app = initializeApp(firebaseConfig);

  const auth = getAuth(app);

  const db = getFirestore(app);


  const SIGNUP_URL =
    "https://alonso121104.github.io/WorldOILLLC/technician-signup.html";


  const technicianEmail =
    document.getElementById("technicianEmail");

  const jobsContainer =
    document.getElementById("jobs");

  const loading =
    document.getElementById("loading");

  const message =
    document.getElementById("message");

  const logoutBtn =
    document.getElementById("logoutBtn");

  const refreshBtn =
    document.getElementById("refreshBtn");


  function showMessage(text) {

    message.textContent = text;

    message.style.display = "block";

  }


  function hideMessage() {

    message.style.display = "none";

  }


  function escapeHtml(value) {

    return String(value ?? "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");

  }


  onAuthStateChanged(auth, async (user) => {

    if (!user) {

      window.location.href = SIGNUP_URL;

      return;

    }


    technicianEmail.textContent = user.email || "";


    try {

      const tokenResult =
        await user.getIdTokenResult(true);


      if (tokenResult.claims.paidTechnician !== true) {

        await signOut(auth);

        window.location.href = SIGNUP_URL;

        return;

      }


      await loadTickets();

    } catch (error) {

      console.error(error);

      showMessage(
        "Unable to verify technician access."
      );

      loading.style.display = "none";

    }

  });


  async function loadTickets() {

    loading.style.display = "block";

    jobsContainer.innerHTML = "";

    hideMessage();


    const user = auth.currentUser;


    if (!user) {

      window.location.href = SIGNUP_URL;

      return;

    }


    try {

      const tokenResult =
        await user.getIdTokenResult(true);


      if (tokenResult.claims.paidTechnician !== true) {

        await signOut(auth);

        window.location.href = SIGNUP_URL;

        return;

      }


      const snapshot =
        await getDocs(
          collection(db, "oilChanges")
        );


      const jobs = [];


      snapshot.forEach((document) => {

        const data = document.data();


        if (
          data.status === "pending" ||
          data.status === "accepted"
        ) {

          jobs.push({
            id: document.id,
            ...data
          });

        }

      });


      jobs.sort((a, b) => {

        const dateA =
          new Date(a.createdAt || 0);

        const dateB =
          new Date(b.createdAt || 0);

        return dateB - dateA;

      });


      loading.style.display = "none";


      if (jobs.length === 0) {

        jobsContainer.innerHTML = `
          <div class="job">
            <h3>No available jobs</h3>
            <p>There are currently no pending oil change requests.</p>
          </div>
        `;

        return;

      }


      jobs.forEach((job) => {

        const jobElement =
          document.createElement("div");

        jobElement.className = "job";


        const status =
          job.status || "pending";


        let actions = "";


        if (status === "pending") {

          actions = `
            <button
              class="accept-btn"
              data-action="accept"
              data-id="${escapeHtml(job.id)}">
              Accept Job
            </button>

            <button
              class="cancel-btn"
              data-action="cancel"
              data-id="${escapeHtml(job.id)}">
              Cancel
            </button>
          `;

        } else if (status === "accepted") {

          actions = `
            <button
              class="complete-btn"
              data-action="complete"
              data-id="${escapeHtml(job.id)}">
              Mark Complete
            </button>

            <button
              class="cancel-btn"
              data-action="cancel"
              data-id="${escapeHtml(job.id)}">
              Cancel
            </button>
          `;

        }


        jobElement.innerHTML = `

          <h3>
            Oil Change Request
          </h3>

          <div class="status ${escapeHtml(status)}">
            ${escapeHtml(status.toUpperCase())}
          </div>

          <p>
            <strong>Customer:</strong>
            ${escapeHtml(job.name || job.customerName || "")}
          </p>

          <p>
            <strong>Phone:</strong>
            ${escapeHtml(job.phone || "")}
          </p>

          <p>
            <strong>Email:</strong>
            ${escapeHtml(job.email || job.customerEmail || "")}
          </p>

          <p>
            <strong>Vehicle:</strong>
            ${escapeHtml(job.vehicle || "")}
          </p>

          <p>
            <strong>Service:</strong>
            ${escapeHtml(job.service || "Oil Change")}
          </p>

          <p>
            <strong>Location:</strong>
            ${escapeHtml(job.location || job.address || "")}
          </p>

          <p>
            <strong>Preferred Date:</strong>
            ${escapeHtml(job.preferredDate || "")}
          </p>

          <p>
            <strong>Preferred Time:</strong>
            ${escapeHtml(job.preferredTime || "")}
          </p>

          <p>
            <strong>Price:</strong>
            $${escapeHtml(job.price || "")}
          </p>

          <p>
            <strong>Notes:</strong>
            ${escapeHtml(job.notes || "")}
          </p>

          <div class="actions">
            ${actions}
          </div>

        `;


        jobsContainer.appendChild(jobElement);

      });


      document
        .querySelectorAll("[data-action]")
        .forEach((button) => {

          button.addEventListener("click", () => {

            const action =
              button.dataset.action;

            const id =
              button.dataset.id;


            updateStatus(id, action);

          });

        });


    } catch (error) {

      console.error(
        "Error loading jobs:",
        error
      );


      loading.style.display = "none";


      showMessage(
        "Unable to load jobs. Your account may not have technician access yet."
      );

    }

  }


  async function updateStatus(id, action) {

    const user = auth.currentUser;


    if (!user) {

      window.location.href = SIGNUP_URL;

      return;

    }


    let newStatus;


    if (action === "accept") {

      newStatus = "accepted";

    } else if (action === "complete") {

      newStatus = "completed";

    } else if (action === "cancel") {

      newStatus = "cancelled";

    } else {

      return;

    }


    const confirmed =
      confirm(
        `Are you sure you want to ${action} this job?`
      );


    if (!confirmed) return;


    try {

      const tokenResult =
        await user.getIdTokenResult(true);


      if (
        tokenResult.claims.paidTechnician !== true
      ) {

        await signOut(auth);

        window.location.href = SIGNUP_URL;

        return;

      }


      const updateData = {

        status: newStatus,

        updatedAt: new Date().toISOString(),

        technicianEmail:
          user.email || ""

      };


      if (newStatus === "accepted") {

        updateData.acceptedAt =
          new Date().toISOString();

      }


      if (newStatus === "completed") {

        updateData.completedAt =
          new Date().toISOString();

      }


      if (newStatus === "cancelled") {

        updateData.cancelledAt =
          new Date().toISOString();

      }


      await updateDoc(
        doc(db, "oilChanges", id),
        updateData
      );


      await loadTickets();


    } catch (error) {

      console.error(
        "Error updating job:",
        error
      );


      alert(
        "Unable to update this job. Please try again."
      );

    }

  }


  logoutBtn.addEventListener(
    "click",
    async () => {

      await signOut(auth);

      window.location.href = SIGNUP_URL;

    }
  );


  refreshBtn.addEventListener(
    "click",
    loadTickets
  );

</script>

</body>
</html>
